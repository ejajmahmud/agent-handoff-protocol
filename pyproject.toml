[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff-protocol"
version = "0.1.0"
description = "Standardized state transfer and context handoff protocol between specialized subagents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-handoff-protocol = "agent_handoff_protocol.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_handoff_protocol*"]
